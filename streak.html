<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Konsistensi | PushMetter</title>
<link rel="icon" type="image/svg+xml" href="asset/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">
<header class="app-navbar">
  <div class="container">
    <a href="index.html" class="brand" aria-label="PushMetter, ke beranda">pushmetter<span class="brand-dot">.</span></a>
    <nav class="app-nav" aria-label="Navigasi aplikasi">
      <a href="dashboard.html" class="nav-item"><span>Live</span><span class="nav-dot"></span></a>
      <a href="history.html" class="nav-item"><span>Riwayat</span><span class="nav-dot"></span></a>
      <a href="aichat.html" class="nav-item"><span>Plato AI</span><span class="nav-dot"></span></a>
      <a href="streak.html" class="nav-item active" aria-current="page"><span>Konsistensi</span><span class="nav-dot"></span></a>
    </nav>
    <div class="user-chip">
      <div class="user-info">
        <div class="name" id="user-name">&nbsp;</div>
        <div class="email" id="user-email">&nbsp;</div>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Ganti tema terang atau gelap" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
      </button>
      <a href="profile.html" class="avatar" id="user-avatar" aria-label="Profil dan pengaturan">U</a>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="container narrow">
    <div class="page-head">
      <h1>Konsistensi</h1>
      <span class="label">Protokol harian</span>
    </div>

    <div class="streak-layout">
      <section aria-label="Streak saat ini">
        <div class="streak-hero">
          <span class="label">Hari berturut-turut</span>
          <div class="streak-number" id="streak-count">0</div>
          <div class="streak-best">Rekor pribadi: <span><span id="streak-best">0</span> hari</span></div>
        </div>
        <div class="streak-week-box">
          <div class="streak-week" id="streak-week" aria-label="Tujuh hari terakhir"></div>
          <p class="streak-status" id="streak-status" role="status">Memuat...</p>
        </div>
      </section>

      <section class="mascot-block" aria-label="Maskot Satria">
        <svg class="mascot" id="streak-mascot" viewBox="0 0 160 160" role="img" aria-label="Maskot Satria">
          <circle class="mascot-line" cx="80" cy="80" r="70" stroke-width="2.5"/>
          <path class="mascot-line" stroke-width="2" d="M80 12v8M80 140v8M12 80h8M140 80h8"/>
          <circle class="mascot-ink" cx="62" cy="74" r="3.5"/>
          <circle class="mascot-ink" cx="98" cy="74" r="3.5"/>
          <circle class="mascot-accent" cx="80" cy="46" r="3"/>
          <path class="mascot-line" id="mascot-mouth" stroke-width="2" d="M 66 98 L 94 98"/>
        </svg>
        <div class="streak-moods" aria-hidden="true">
          <span data-mood="happy">happy</span>
          <span data-mood="flat" class="is-on">neutral</span>
          <span data-mood="sad">sad</span>
        </div>
        <p class="streak-note" id="streak-note"></p>
        <p><a class="text-link" href="aichat.html" id="resume-link" hidden>Buka Plato AI untuk melanjutkan</a></p>
        <button type="button" class="btn btn-outline btn-block" id="calendar-btn" aria-expanded="false" aria-controls="calendar">Lihat kalender streak</button>
        <div class="calendar" id="calendar" hidden>
          <div class="cal-grid" id="calendar-grid"></div>
          <p class="calendar-note" id="calendar-note"></p>
        </div>
      </section>
    </div>
  </div>
</main>

<script type="module" src="js/streakpage.js"></script>
</body>
</html>
